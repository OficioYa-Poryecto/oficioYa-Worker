spring.application.name=worker
server.port=8082
spring.config.import=optional:file:.env[.properties]

# Credenciales por variables de entorno (ver README). Sin valores por defecto: si faltan, la app no arranca.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT: la clave debe ser la misma que usa Identity para firmar (minimo 32 caracteres)
security.jwt.secret=${JWT_SECRET}

# true = los GET de consulta (catalogo, trabajadores, disponibilidad, fotos) no exigen token
security.public-queries=${PUBLIC_QUERIES:false}

logging.file.name=logs/worker.log

# Integración con otros dominios: todo pasa por el Orquestador. URL provisional hasta que confirmen puerto y rutas.
integration.orchestrator.base-url=${ORCHESTRATOR_BASE_URL:http://localhost:8081/api}

# Tiempos de espera de los clientes HTTP hacia otros dominios
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s
