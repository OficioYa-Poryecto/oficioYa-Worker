# Despliega el back de Worker en Azure App Service (oficioya-worker-api) cada vez que hay push a develop.
# Autenticación sin contraseñas: GitHub entra a Azure con OIDC usando la identidad oficioya-worker-github.
# Secretos del repo que necesita: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID.
name: Deploy Worker a Azure

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  id-token: write   # para pedir el token OIDC que Azure acepta
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Corre las pruebas (perfil test con H2) y la regla de cobertura de JaCoCo; si fallan, no se despliega.
      - name: Compilar y probar
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Iniciar sesión en Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar en App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: oficioya-worker-api
          package: target/worker-0.0.1-SNAPSHOT.jar
